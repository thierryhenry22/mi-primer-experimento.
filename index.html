<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HENRY MANSION: INVESTIGATION</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            border: 1px solid rgba(255,255,255,0.8); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
        #hud {
            position: absolute; top: 20px; left: 20px; color: #0f0; 
            background: rgba(0,0,0,0.7); padding: 15px; border-left: 4px solid #0f0;
            font-size: 14px; pointer-events: none;
        }
        #interaction {
            position: absolute; bottom: 15%; width: 100%; text-align: center;
            color: white; font-size: 20px; text-transform: uppercase;
            letter-spacing: 3px; opacity: 0; transition: 0.2s; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="hud">
        ESTADO: INVESTIGACIÓN<br>
        OBJETIVO: HALLAR 3 DOCUMENTOS<br>
        PROGRESO: <span id="count">0</span>/3
    </div>
    <div id="interaction">PRESIONA [E] PARA ANALIZAR PISTA</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // 1. ESCENA Y MOTOR PRO
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.15);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // 2. TEXTURAS PROCEDURALES (No fallan nunca)
        const createTex = (c1, c2) => {
            const can = document.createElement('canvas'); can.width = can.height = 256;
            const ctx = can.getContext('2d');
            ctx.fillStyle = c1; ctx.fillRect(0,0,256,256);
            for(let i=0; i<100; i++) { ctx.fillStyle = c2; ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2); }
            return new THREE.CanvasTexture(can);
        };
        const floorTex = createTex('#1a1a1a', '#333333');

        // 3. CONSTRUCCIÓN (Unity Style)
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({map: floorTex}));
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        const wallMat = new THREE.MeshStandardMaterial({color: 0x111111, roughness: 1});
        const wall = new THREE.Mesh(new THREE.BoxGeometry(40, 10, 1), wallMat);
        wall.position.set(0, 5, -20);
        scene.add(wall);

        // 4. PISTAS INTERACTIVAS
        const clues = [];
        const spawnClue = (x, z, label) => {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.7), new THREE.MeshStandardMaterial({color: 0xeeeeee, emissive: 0xffffff, emissiveIntensity: 0.1}));
            mesh.position.set(x, 0.05, z);
            mesh.userData = { label: label };
            scene.add(mesh);
            clues.push(mesh);
        };
        spawnClue(3, -5, "NOTA SUCIA");
        spawnClue(-8, -12, "FOTO ANTIGUA");
        spawnClue(0, -18, "DIARIO DE HENRY");

        // 5. LINTERNA Y LUCES
        const light = new THREE.SpotLight(0xffffff, 30);
        light.angle = 0.5; camera.add(light);
        light.position.set(0,0,0.1); light.target.position.set(0,0,-1);
        camera.add(light.target); scene.add(camera);

        // 6. CONTROLES Y RAYCAST
        const controls = new PointerLockControls(camera, document.body);
        document.body.onclick = () => controls.lock();
        const raycaster = new THREE.Raycaster();
        let found = 0;

        window.onkeydown = (e) => {
            if(e.code === 'KeyE') {
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                const hit = raycaster.intersectObjects(clues);
                if(hit.length > 0) {
                    const obj = hit[0].object;
                    scene.remove(obj);
                    clues.splice(clues.indexOf(obj), 1);
                    found++;
                    document.getElementById('count').innerText = found;
                    if(found === 3) alert("TODAS LAS PISTAS RECOGIDAS.");
                }
            }
        };

        let move = { f:0, s:0 };
        document.onkeydown = (e) => {
            if(e.code === 'KeyW') move.f = 0.12; if(e.code === 'KeyS') move.f = -0.12;
            if(e.code === 'KeyA') move.s = -0.12; if(e.code === 'KeyD') move.s = 0.12;
            if(e.code === 'KeyE') window.onkeydown({code: 'KeyE'}); // Trigger interacción
        };
        document.onkeyup = (e) => { if(['KeyW','KeyS'].includes(e.code)) move.f = 0; if(['KeyA','KeyD'].includes(e.code)) move.s = 0; };

        function animate() {
            requestAnimationFrame(animate);
            if(controls.isLocked) {
                controls.moveForward(move.f); controls.moveRight(move.s);
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                document.getElementById('interaction').style.opacity = raycaster.intersectObjects(clues).length > 0 ? "1" : "0";
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
