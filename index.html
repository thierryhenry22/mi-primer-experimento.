<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HENRY MANSION: PROCEDURAL GEN</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        #canvas-container { width: 100%; height: 100%; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #ui-text {
            position: absolute; bottom: 10%; width: 100%; text-align: center;
            color: white; font-size: 1.5rem; letter-spacing: 2px;
            text-shadow: 0 0 10px #000; pointer-events: none; opacity: 0; transition: 0.2s;
        }
        #inventory {
            position: absolute; top: 20px; left: 20px; color: #aaa;
            border-left: 3px solid #f00; padding-left: 15px; font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="inventory">EXPEDIENTE: HENRY_01<br>PISTAS ENCONTRADAS: <span id="clues">0</span>/3</div>
    <div id="ui-text">PRESIONA [E] PARA RECOGER PISTA</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- RENDERER PRO ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.12);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- GENERADOR DE TEXTURAS (Adiós a los errores de imagen) ---
        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#3d2b1f';
            ctx.fillRect(0,0,256,256);
            for(let i=0; i<50; i++) {
                ctx.fillStyle = `rgba(30,20,10,${Math.random()})`;
                ctx.fillRect(Math.random()*256, 0, Math.random()*5, 256);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // --- CONSTRUCCIÓN DE LA MANSIÓN ---
        const woodTex = createWoodTexture();
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
        const floorMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.6 });

        // Suelo y Techo
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMat);
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        // Paredes
        const wallGeo = new THREE.BoxGeometry(30, 6, 0.5);
        const wall1 = new THREE.Mesh(wallGeo, wallMat);
        wall1.position.set(0, 3, -15);
        scene.add(wall1);

        // --- OBJETOS / PISTAS ---
        const interactiveObjects = [];
        function spawnClue(x, z, name) {
            const group = new THREE.Group();
            const paper = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.05, 0.6), new THREE.MeshStandardMaterial({color: 0xffffff}));
            paper.position.y = 0.05;
            group.add(paper);
            group.position.set(x, 0, z);
            group.userData = { name: name, isClue: true };
            scene.add(group);
            interactiveObjects.push(group);
        }

        spawnClue(5, -5, "Carta de Despedida");
        spawnClue(-3, -10, "Foto Rasgada");
        spawnClue(0, -12, "Llave del Sótano");

        // --- ILUMINACIÓN ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.1);
        scene.add(ambient);

        const flashlight = new THREE.SpotLight(0xffeebb, 20);
        flashlight.angle = Math.PI/6;
        flashlight.penumbra = 0.5;
        camera.add(flashlight);
        flashlight.position.set(0,0,0.1);
        flashlight.target.position.set(0,0,-1);
        camera.add(flashlight.target);
        scene.add(camera);

        // --- INTERACCIÓN ---
        const controls = new PointerLockControls(camera, document.body);
        document.body.onclick = () => controls.lock();

        const raycaster = new THREE.Raycaster();
        const uiText = document.getElementById('ui-text');
        let collected = 0;

        window.addEventListener('keydown', (e) => {
            if(e.code === 'KeyE') {
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                const intersects = raycaster.intersectObjects(interactiveObjects, true);
                if(intersects.length > 0) {
                    const picked = intersects[0].object.parent;
                    console.log("Recogido:", picked.userData.name);
                    scene.remove(picked);
                    collected++;
                    document.getElementById('clues').innerText = collected;
                    if(collected === 3) alert("TODAS LAS PISTAS RECOGIDAS. SAL DE LA CASA.");
                }
            }
        });

        // --- MOVIMIENTO ---
        let input = { f:0, s:0 };
        document.onkeydown = (e) => {
            if(e.code === 'KeyW') input.f = 1;
            if(e.code === 'KeyS') input.f = -1;
            if(e.code === 'KeyA') input.s = -1;
            if(e.code === 'KeyD') input.s = 1;
        };
        document.onkeyup = (e) => {
            if(['KeyW','KeyS'].includes(e.code)) input.f = 0;
            if(['KeyA','KeyD'].includes(e.code)) input.s = 0;
        };

        function animate() {
            requestAnimationFrame(animate);
            if(controls.isLocked) {
                controls.moveForward(input.f * 0.1);
                controls.moveRight(input.s * 0.1);

                // Raycast para HUD
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                const intersects = raycaster.intersectObjects(interactiveObjects, true);
                uiText.style.opacity = intersects.length > 0 ? "1" : "0";
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
